<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>星空档案 · 记忆树</title>

  <script>
    (function(){
      var v = '1.4.36';
      try {
        function newer(a, b) {
          if (!b) return true;
          var pa = String(a).split('.'), pb = String(b).split('.');
          for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
            var na = parseInt(pa[i] || 0, 10) || 0, nb = parseInt(pb[i] || 0, 10) || 0;
            if (na > nb) return true;
            if (na < nb) return false;
          }
          return false;
        }
        var m = location.search.match(/[?&]v=([^&]+)/);
        var cur = m ? m[1] : '';
        var latest = localStorage.getItem('mt_v_latest') || '';
        if (newer(v, cur) && newer(v, latest)) {
          location.replace(location.href.split('?')[0] + '?v=' + v);
        } else if (latest && newer(latest, v)) {
          location.replace(location.href.split('?')[0] + '?v=' + latest);
        } else {
          localStorage.setItem('mt_v', v);
          localStorage.setItem('mt_v_latest', v);
        }
      } catch(e){}
    })();
  </script>

  <link rel="stylesheet" href="../css/memory-tree.css?v=1.4.36" />

  <!-- Three.js 走 CDN importmap，与 if-client.js 一致 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body data-theme="starry">
  <!-- 进入 / 加载层：E · 星海隧道（canvas 粒子 + GSAP 收束） -->
  <div id="mt-loader" class="mt-loader" aria-hidden="false">
    <canvas id="mt-loader-canvas" class="mt-loader-canvas"></canvas>
    <div class="mt-loader-tag">星空档案</div>
  </div>

  <!-- 3D 画布 -->
  <canvas id="mt-canvas" class="mt-canvas"></canvas>

  <!-- 暗角遮罩：压住画面边缘，突出中心星河，同时让 HUD 更易读 -->
  <div class="mt-vignette" aria-hidden="true"></div>

  <!-- 顶部 HUD -->
  <header class="mt-hud" id="mt-hud">
    <button id="mt-back" class="mt-btn mt-back-btn" title="返回频道">
      <span class="mt-back-arrow">←</span>
      <span>返回频道</span>
    </button>
    <button id="mt-post-trigger" class="mt-hud-title-wrap" type="button" title="在记忆树留言">
      <span class="mt-hud-icon">🌌</span>
      <span class="mt-hud-title">记忆树</span>
    </button>
    <div class="mt-music-card" id="mt-music-card">
      <button class="mt-disc" id="mt-music-disc" type="button" title="播放 / 暂停">
        <span class="mt-disc-label">♫</span>
      </button>
      <div class="mt-music-info">
        <div class="mt-music-name" id="mt-music-name">星空旋律</div>
        <div class="mt-music-artist" id="mt-music-artist">记忆树原声</div>
      </div>
    </div>
  </header>

  <!-- 提示气泡 -->
  <div id="mt-toast" class="mt-toast" hidden></div>

  <!-- 详情 / 评论弹层 -->
  <div id="mt-detail" class="mt-detail" hidden>
    <div class="mt-detail-card">
      <button id="mt-detail-delete" class="mt-detail-close" aria-label="删除该帖子" title="删除该帖子（管理员）" hidden>✕</button>

      <div class="mt-detail-media" id="mt-detail-media"></div>

      <div class="mt-detail-info">
        <div class="mt-detail-header">
          <div class="mt-detail-eyebrow">
            <svg class="mt-detail-eyebrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            <span>精神印记</span>
          </div>
          <h2 class="mt-detail-title" id="mt-detail-title"></h2>
          <div class="mt-detail-meta">
            <div class="mt-detail-meta-label">拍摄地点 / 备注</div>
            <div class="mt-detail-meta-value" id="mt-detail-meta"></div>
          </div>
        </div>

        <div class="mt-detail-body">
          <div id="mt-summary" class="mt-summary" hidden></div>

          <div class="mt-comments-head">
            <span>💬 记忆留言</span>
            <span class="mt-comments-count" id="mt-comments-count">0</span>
          </div>
          <div id="mt-comments" class="mt-comments">
            <div class="mt-comments-empty">暂无评论，快来抢沙发~</div>
          </div>
        </div>

        <form id="mt-comment-form" class="mt-comment-form" autocomplete="off">
          <div class="mt-comment-input-bar">
            <button type="button" class="mt-comment-image-btn" id="mt-comment-image-btn" aria-label="添加图片">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
            <input id="mt-comment-text" class="mt-comment-input" type="text" maxlength="300" placeholder="输入你的评论..." required />
            <button type="submit" class="mt-btn-send-text">发送</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 在记忆树留言 -->
  <div id="mt-post-modal" class="mt-modal" hidden>
    <div class="mt-modal-card">
      <button id="mt-post-close" class="mt-detail-close" type="button" aria-label="关闭">✕</button>
      <div class="mt-modal-header">
        <div class="mt-detail-eyebrow">
          <svg class="mt-detail-eyebrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          <span>精神印记</span>
        </div>
        <h2 class="mt-detail-title">在记忆树留言</h2>
      </div>
      <form id="mt-post-form" class="mt-post-form" autocomplete="off">
        <textarea id="mt-post-text" class="mt-input mt-textarea" maxlength="300" placeholder="写下你想留在记忆树的话…（发布后将作为一颗星挂在树上）" required></textarea>
        <div class="mt-post-image-row" id="mt-post-image-row" hidden>
          <img id="mt-post-image-preview" class="mt-post-image-preview" alt="图片预览" />
          <button type="button" id="mt-post-image-remove" class="mt-post-image-remove" aria-label="移除图片">✕</button>
        </div>
        <div class="mt-post-bottom">
          <button type="button" id="mt-post-image-btn" class="mt-post-image-btn" aria-label="添加照片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span>添加照片</span>
          </button>
          <input type="file" id="mt-post-image-input" accept="image/*" hidden />
          <label class="mt-post-anon"><input type="checkbox" id="mt-post-anon" checked /> 匿名</label>
          <span id="mt-post-author-hint" class="mt-post-author-hint"></span>
        </div>
        <div class="mt-post-actions">
          <button type="button" id="mt-post-cancel" class="mt-post-btn mt-post-btn-secondary">取消</button>
          <button type="submit" class="mt-post-btn mt-post-btn-send" id="mt-post-send">发布</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 图片放大预览 -->
  <div id="mt-lightbox" class="mt-lightbox" hidden>
    <button id="mt-lightbox-close" class="mt-lightbox-close" type="button" aria-label="关闭">✕</button>
    <img id="mt-lightbox-img" class="mt-lightbox-img" src="" alt="预览大图" />
  </div>

  <!-- WebGL 兜底：静态相册 -->
  <div id="mt-fallback" class="mt-fallback" hidden>
    <div class="mt-fallback-head">🌌 记忆相册（当前设备不支持 3D，已切换为相册模式）</div>
    <div id="mt-fallback-grid" class="mt-fallback-grid"></div>
  </div>

  <!-- 依赖：GSAP（已有） → InsForge 客户端 → 场景 → 配置 → 评论/AI → 引导 -->
  <script src="../js/lib/gsap.min.js?v=1.4.36" defer></script>
  <script type="module" src="../js/if-client.js?v=1.4.36"></script>
  <script type="module" src="../js/three-scene.js?v=1.4.36"></script>
  <script type="module" src="../js/memory-tree-config.js?v=1.4.36"></script>
  <script type="module" src="../js/memory-comments.js?v=1.4.36"></script>
  <script type="module" src="../js/memory-ai.js?v=1.4.36"></script>
  <script type="module" src="../js/memory-posts.js?v=1.4.36"></script>
  <script type="module" src="../js/memory-tree.js?v=1.4.36"></script>
</body>
</html>
