<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script type="module" src="../js/if-client.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        color: #111;
      }
      .page {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 100vh;
      }

      /* ===================== LEFT: Characters (from user's 2nd HTML, verbatim) ===================== */
      .left {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding: 24px 48px 32px;
        background-color: #fff;
        background-image: repeating-linear-gradient(
          transparent,
          transparent 27px,
          rgba(0, 0, 0, 0.06) 27px,
          rgba(0, 0, 0, 0.06) 29px
        );
        color: #111;
        overflow: hidden;
      }
      .blob1,
      .blob2 {
        display: none;
      }
      .blob1 {
        top: 25%;
        right: 25%;
        width: 256px;
        height: 256px;
        background: rgba(156, 163, 175, 0.2);
      }
      .blob2 {
        bottom: 25%;
        left: 25%;
        width: 384px;
        height: 384px;
        background: rgba(209, 213, 219, 0.2);
      }
      .grid-overlay {
        display: none;
      }
      .characters-wrap {
        position: relative;
        z-index: 20;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        flex-shrink: 0;
      }
      .characters {
        position: relative;
        width: 550px;
        height: 400px;
      }
      .char {
        position: absolute;
        bottom: 0;
        transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: bottom center;
      }
      .char-purple {
        left: 70px;
        width: 180px;
        height: 400px;
        background: #6c3ff5;
        border-radius: 10px 10px 0 0;
        z-index: 1;
      }
      .char-purple .eyes-wrap {
        position: absolute;
        display: flex;
        gap: 32px;
        transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .char-black {
        left: 240px;
        width: 120px;
        height: 310px;
        background: #2d2d2d;
        border-radius: 8px 8px 0 0;
        z-index: 2;
      }
      .char-black .eyes-wrap {
        position: absolute;
        display: flex;
        gap: 24px;
        transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .char-orange {
        left: 0;
        width: 240px;
        height: 200px;
        background: #ff9b6b;
        border-radius: 120px 120px 0 0;
        z-index: 3;
      }
      .char-orange .eyes-wrap {
        position: absolute;
        display: flex;
        gap: 32px;
        transition: all 0.2s ease-out;
      }
      .char-yellow {
        left: 310px;
        width: 140px;
        height: 230px;
        background: #e8d754;
        border-radius: 70px 70px 0 0;
        z-index: 4;
      }
      .char-yellow .eyes-wrap {
        position: absolute;
        display: flex;
        gap: 24px;
        transition: all 0.2s ease-out;
      }
      .char-yellow .mouth {
        position: absolute;
        width: 80px;
        height: 4px;
        background: #2d2d2d;
        border-radius: 4px;
        transition: all 0.2s ease-out;
      }
      .eyeball {
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: height 0.15s;
        background: #fff;
      }
      .eyeball .pupil {
        border-radius: 50%;
        background: #2d2d2d;
        transition: transform 0.1s ease-out;
      }
      .pupil-only {
        border-radius: 50%;
        background: #2d2d2d;
        transition: transform 0.1s ease-out;
      }

      /* ===================== RIGHT: Doodle card (Zora-81 source, verbatim) ===================== */
      .right {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #fff;
        background-image: repeating-linear-gradient(
          transparent,
          transparent 27px,
          rgba(0, 0, 0, 0.06) 27px,
          rgba(0, 0, 0, 0.06) 29px
        );
      }
      .stars-bg {
        display: none;
      }
      @keyframes twinkle { 0% { opacity: 0.6; } 100% { opacity: 1; } }
      .login-close {
        position: absolute;
        top: 20px; right: 20px;
        z-index: 50;
        width: 36px; height: 36px;
        border-radius: 50%;
        border: 2px solid var(--ink);
        background: #fff;
        color: var(--ink);
        opacity: 0.4;
        font-size: 18px;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s;
      }
      .login-close:hover { opacity: 1; }

      /* ---- begin Zora-81 verbatim block ---- */
      .doodle-wrapper {
        /* Color Palette */
        --ink: #323232;
        --paper-front: #fff9e6;
        --paper-back: #e6f0ff;
        --bg-color: #ffffff;
        --primary-btn: #ff6b6b;
        --primary-btn-hover: #ff5252;
        --secondary-btn: #4ecdc4;
        --secondary-btn-hover: #3bbfb6;
        --switch-bg: #ffe66d;
        --input-focus: #2d8cf0;

        /* Sizing */
        --card-width: 380px;
        --card-height: 440px;
        --input-width: 320px;
        --input-height: 44px;
        --btn-width: 150px;
        --btn-height: 46px;

        --border-width: 2px;
        --shadow-offset: 4px;

        /* Doodle Border Radiuses */
        --sketch-radius-1: 8px 24px 8px 24px / 24px 8px 24px 8px;
        --sketch-radius-2: 24px 8px 24px 8px / 8px 24px 8px 24px;
        --sketch-radius-btn: 16px 5px 16px 5px / 5px 16px 5px 16px;

        font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Gochi Hand",
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        box-sizing: border-box;
        z-index: 10;
      }

      /* Hide Checkbox Visually but keep accessible */
      .doodle-toggle {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      /* Header & Switch */
      .doodle-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
        z-index: 5;
      }

      .doodle-mode-text {
        font-size: 20px;
        font-weight: bold;
        color: var(--ink);
        transition: opacity 0.3s;
      }

      .doodle-toggle:not(:checked) ~ .doodle-header .signup-text { opacity: 0.5; }
      .doodle-toggle:checked ~ .doodle-header .login-text { opacity: 0.5; }

      .doodle-switch-label {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
        background-color: var(--switch-bg);
        border: var(--border-width) solid var(--ink);
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 2px 2px 0px var(--ink);
        transition: transform 0.1s, box-shadow 0.1s;
      }

      .doodle-switch-label:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px var(--ink);
      }

      .doodle-switch-handle {
        position: absolute;
        top: 2px;
        left: 3px;
        width: 16px;
        height: 16px;
        background-color: var(--bg-color);
        border: var(--border-width) solid var(--ink);
        border-radius: 50%;
        transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      .doodle-toggle:checked ~ .doodle-header .doodle-switch-label .doodle-switch-handle {
        transform: translateX(24px);
      }

      /* 3D Scene Setup */
      .doodle-card-scene {
        position: relative;
        perspective: 1000px;
        width: var(--card-width);
        height: var(--card-height);
        z-index: 2;
      }

      /* Decorative SVGs */
      .doodle-svg {
        position: absolute;
        z-index: -1;
        pointer-events: none;
      }
      .doodle-star {
        top: -25px;
        left: -35px;
        width: 48px;
        height: 48px;
        animation: float-star 4s ease-in-out infinite;
      }
      .doodle-sparkle {
        bottom: -20px;
        right: -25px;
        width: 40px;
        height: 40px;
        animation: float-sparkle 4s ease-in-out infinite 1s;
      }
      .doodle-swirl {
        top: 30px;
        right: -30px;
        width: 32px;
        height: 32px;
        animation: float-swirl 4s ease-in-out infinite 2s;
      }

      @keyframes float-star {
        0%, 100% { transform: translateY(0) rotate(-15deg); }
        50% { transform: translateY(-8px) rotate(-10deg); }
      }
      @keyframes float-sparkle {
        0%, 100% { transform: translateY(0) rotate(10deg); }
        50% { transform: translateY(-8px) rotate(15deg); }
      }
      @keyframes float-swirl {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(5deg); }
      }

      /* Card Inner & Faces */
      .doodle-card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      }

      .doodle-toggle:checked ~ .doodle-card-scene .doodle-card-inner {
        transform: rotateY(180deg);
      }

      .doodle-card-front,
      .doodle-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        border: var(--border-width) solid var(--ink);
        border-radius: var(--sketch-radius-1);
        box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--ink);

        background-image: repeating-linear-gradient(
          transparent,
          transparent 28px,
          rgba(0, 0, 0, 0.06) 28px,
          rgba(0, 0, 0, 0.06) 30px
        );
        background-position: 0 15px;
      }

      .doodle-card-front { background-color: var(--paper-front); }

      .doodle-card-back {
        background-color: var(--paper-back);
        transform: rotateY(180deg);
        border-radius: var(--sketch-radius-2);
      }

      /* Typography & Forms */
      .doodle-title {
        font-size: 30px;
        font-weight: 900;
        color: var(--ink);
        margin: 10px 0 20px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
        transform: rotate(-3deg);
        text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
      }
      .doodle-title-alt {
        transform: rotate(2deg);
        margin: 0px 0 15px 0;
      }
      .doodle-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        align-items: center;
      }
      .doodle-input-wrapper { position: relative; }
      .doodle-input {
        width: var(--input-width);
        height: var(--input-height);
        padding: 5px 15px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        background-color: var(--bg-color);
        border: var(--border-width) solid var(--ink);
        border-radius: var(--sketch-radius-1);
        box-shadow: 3px 3px 0px var(--ink);
        outline: none;
        transition: all 0.2s ease;
      }
      .doodle-input::placeholder { color: #666; opacity: 0.8; }
      .doodle-input:hover { transform: translateY(-2px); box-shadow: 4px 4px 0px var(--ink); }
      .doodle-input:focus,
      .doodle-input:focus-visible {
        border: var(--border-width) solid var(--input-focus);
        border-radius: var(--sketch-radius-2);
        background-color: #fffdf5;
        box-shadow: 4px 4px 0px var(--ink);
      }
      .doodle-btn {
        margin: 15px 0;
        width: var(--btn-width);
        height: var(--btn-height);
        font-family: inherit;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 1px;
        color: var(--ink);
        background-color: var(--primary-btn);
        border: var(--border-width) solid var(--ink);
        border-radius: var(--sketch-radius-btn);
        box-shadow: 4px 4px 0px var(--ink);
        cursor: pointer;
        transition: all 0.15s ease;
        transform: rotate(-1deg);
      }
      .doodle-btn-alt {
        background-color: var(--secondary-btn);
        transform: rotate(1deg);
      }
      .doodle-btn:hover {
        background-color: var(--primary-btn-hover);
        transform: translateY(-2px) rotate(-2deg);
        box-shadow: 5px 5px 0px var(--ink);
      }
      .doodle-btn-alt:hover {
        background-color: var(--secondary-btn-hover);
        transform: translateY(-2px) rotate(2deg);
      }
      .doodle-btn:active {
        transform: translate(3px, 3px) rotate(0deg);
        box-shadow: 0px 0px 0px var(--ink);
      }
      .doodle-card-scene:hover .doodle-title {
        animation: doodle-wiggle 0.5s ease-in-out;
      }
      @keyframes doodle-wiggle {
        0%, 100% { transform: rotate(-3deg); }
        25% { transform: rotate(2deg); }
        50% { transform: rotate(-4deg); }
        75% { transform: rotate(1deg); }
      }
      /* ---- end Zora-81 verbatim block ---- */

      /* Password eye toggle — added feature, ink-colored to match doodle */
      .doodle-input-wrapper input[type="password"] { padding-right: 38px; }
      .doodle-pw-toggle {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--ink);
        padding: 0;
      }
      .doodle-pw-toggle svg { width: 20px; height: 20px; pointer-events: none; }

      /* ===================== Responsive (from user's 2nd HTML) ===================== */
      @media (max-width: 1024px) {
        body { height: auto; overflow: auto; }
        .page { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
        .left { padding: 24px 16px 0; }
        .characters-wrap { height: 220px; }
        .characters { transform: scale(0.45); transform-origin: bottom center; }
        .right { padding: 24px 20px 40px; min-height: 70vh; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- LEFT: Characters (verbatim from user's 2nd HTML) -->
      <div class="left">
        <div class="characters-wrap">
          <div class="characters" id="characters">
            <div class="char char-purple" id="purple">
              <div class="eyes-wrap" id="purple-eyes">
                <div class="eyeball" id="purple-eye-l" style="width: 18px; height: 18px">
                  <div class="pupil" style="width: 7px; height: 7px"></div>
                </div>
                <div class="eyeball" id="purple-eye-r" style="width: 18px; height: 18px">
                  <div class="pupil" style="width: 7px; height: 7px"></div>
                </div>
              </div>
            </div>
            <div class="char char-black" id="black">
              <div class="eyes-wrap" id="black-eyes">
                <div class="eyeball" id="black-eye-l" style="width: 16px; height: 16px">
                  <div class="pupil" style="width: 6px; height: 6px"></div>
                </div>
                <div class="eyeball" id="black-eye-r" style="width: 16px; height: 16px">
                  <div class="pupil" style="width: 6px; height: 6px"></div>
                </div>
              </div>
            </div>
            <div class="char char-orange" id="orange">
              <div class="eyes-wrap" id="orange-eyes">
                <div class="pupil-only" style="width: 12px; height: 12px"></div>
                <div class="pupil-only" style="width: 12px; height: 12px"></div>
              </div>
            </div>
            <div class="char char-yellow" id="yellow">
              <div class="eyes-wrap" id="yellow-eyes">
                <div class="pupil-only" style="width: 12px; height: 12px"></div>
                <div class="pupil-only" style="width: 12px; height: 12px"></div>
              </div>
              <div class="mouth" id="yellow-mouth"></div>
            </div>
          </div>
        </div>
        <div class="grid-overlay"></div>
        <div class="blob1"></div>
        <div class="blob2"></div>
      </div>

      <!-- RIGHT: Doodle card (Zora-81 verbatim) -->
      <div class="right">
        <div class="stars-bg"></div>
        <button class="login-close" aria-label="Close">✕</button>

        <div class="doodle-wrapper">
          <input type="checkbox" class="doodle-toggle" id="doodle" aria-label="Toggle Login and Sign up" />

          <div class="doodle-header">
            <span class="doodle-mode-text login-text">Log in</span>
            <label class="doodle-switch-label" for="doodle">
              <span class="doodle-switch-handle"></span>
            </label>
            <span class="doodle-mode-text signup-text">Sign up</span>
          </div>

          <div class="doodle-card-scene">
            <svg class="doodle-svg doodle-star" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 2L27.09 16.91L42 20L27.09 23.09L24 38L20.91 23.09L6 20L20.91 16.91L24 2Z" fill="#ffd700" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <svg class="doodle-svg doodle-sparkle" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 4L22 18L36 20L22 22L20 36L18 22L4 20L18 18Z" fill="#ff6b6b" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="20" cy="20" r="3" fill="#fff"/>
            </svg>
            <svg class="doodle-svg doodle-swirl" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 4C9.37 4 4 9.37 4 16s5.37 12 12 12c2.76 0 5.33-.88 7.43-2.38" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
              <circle cx="24" cy="22" r="4" fill="#4ecdc4" stroke="var(--ink)" stroke-width="1.5"/>
            </svg>

            <div class="doodle-card-inner">
              <!-- FRONT -->
              <div class="doodle-card-front">
                <h2 class="doodle-title">WELCOME!</h2>
                <form class="doodle-form" onsubmit="return false;">
                  <div class="doodle-input-wrapper">
                    <input class="doodle-input" type="email" placeholder="example@email.com" />
                  </div>
                  <div class="doodle-input-wrapper">
                    <input id="login-pw" class="doodle-input" type="password" placeholder="Password" />
                    <button type="button" class="doodle-pw-toggle" id="login-eye" aria-label="Toggle password visibility">
                      <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                      </svg>
                      <svg class="eye-closed" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/>
                      </svg>
                    </button>
                  </div>
                  <button type="submit" class="doodle-btn">Let's Go!</button>
                </form>
              </div>
              <!-- BACK -->
              <div class="doodle-card-back">
                <h2 class="doodle-title doodle-title-alt">JOIN US!</h2>
                <form class="doodle-form" onsubmit="return false;">
                  <div class="doodle-input-wrapper">
                    <input class="doodle-input" type="email" placeholder="example@email.com" />
                  </div>
                  <div class="doodle-input-wrapper">
                    <input class="doodle-input" type="text" placeholder="Username" />
                  </div>
                  <div class="doodle-input-wrapper">
                    <input id="signup-pw" class="doodle-input" type="password" placeholder="Password" />
                    <button type="button" class="doodle-pw-toggle" id="signup-eye" aria-label="Toggle password visibility">
                      <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                      </svg>
                      <svg class="eye-closed" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/>
                      </svg>
                    </button>
                  </div>
                  <button type="submit" class="doodle-btn doodle-btn-alt">Sign up</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

      <!-- 邮箱验证 / 结果浮层（真实后端接线） -->
      <div id="auth-overlay" style="display:none; position:absolute; inset:0; z-index:60; background:rgba(255,255,255,0.97); flex-direction:column; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; text-align:center;">
        <div style="max-width:320px; width:100%;">
          <h2 id="auth-overlay-title" style="font-family:'Comic Sans MS','Chalkboard SE',cursive; color:#323232; margin:0 0 12px; font-size:26px;">验证邮箱</h2>
          <p id="auth-overlay-sub" style="color:#555; font-size:14px; margin:0 0 18px;"></p>
          <input id="verify-code-input" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" style="width:100%; height:44px; padding:5px 15px; box-sizing:border-box; font-family:inherit; font-size:15px; font-weight:600; color:#323232; background:#fff; border:2px solid #323232; border-radius:8px 24px 8px 24px / 24px 8px 24px 8px; box-shadow:3px 3px 0 #323232; outline:none;" />
          <button id="verify-submit-btn" type="button" style="margin:18px 0 0; width:150px; height:46px; font-family:inherit; font-size:17px; font-weight:900; letter-spacing:1px; color:#323232; background:#ff6b6b; border:2px solid #323232; border-radius:16px 5px 16px 5px / 5px 16px 5px 16px; box-shadow:4px 4px 0 #323232; cursor:pointer; transform:rotate(-1deg);">验证并登录</button>
          <p id="auth-overlay-error" style="color:#d33; font-size:13px; min-height:18px; margin:12px 0 0;"></p>
          <button id="auth-overlay-back" type="button" style="margin-top:10px; background:none; border:none; color:#323232; text-decoration:underline; cursor:pointer; font-size:13px;">返回</button>
        </div>
      </div>

    <!-- Character animation script (verbatim from user's 2nd HTML) -->
    <script>
      let mouseX = 0, mouseY = 0;
      let isTyping = false;
      let showPassword = false;
      let passwordLen = 0;
      let purpleBlink = false, blackBlink = false;
      let lookingAtEachOther = false;
      let purplePeeking = false;
      const $purple = document.getElementById("purple");
      const $black = document.getElementById("black");
      const $orange = document.getElementById("orange");
      const $yellow = document.getElementById("yellow");
      const $purpleEyes = document.getElementById("purple-eyes");
      const $blackEyes = document.getElementById("black-eyes");
      const $orangeEyes = document.getElementById("orange-eyes");
      const $yellowEyes = document.getElementById("yellow-eyes");
      const $yellowMouth = document.getElementById("yellow-mouth");
      const $emailInput = document.querySelector(".doodle-card-front .doodle-input");
      const $passwordInput = document.getElementById("login-pw");
      const $signupInput = document.getElementById("signup-pw");
      document.addEventListener("mousemove", (e) => { mouseX = e.clientX; mouseY = e.clientY; });
      $emailInput.addEventListener("focus", () => { isTyping = true; triggerLookAtEachOther(); });
      $emailInput.addEventListener("blur", () => { isTyping = false; lookingAtEachOther = false; });
      function bindField(input) {
        input.addEventListener("input", () => { passwordLen = input.value.length; });
        input.addEventListener("focus", () => { isTyping = true; triggerLookAtEachOther(); });
        input.addEventListener("blur", () => { isTyping = false; lookingAtEachOther = false; });
      }
      bindField($passwordInput);
      bindField($signupInput);
      function applyShowPassword(val) {
        showPassword = val;
        [$passwordInput, $signupInput].forEach((inp) => { inp.type = val ? "text" : "password"; });
        ["login-eye", "signup-eye"].forEach((id) => {
          const btn = document.getElementById(id);
          btn.querySelector(".eye-open").style.display = val ? "none" : "";
          btn.querySelector(".eye-closed").style.display = val ? "" : "none";
        });
      }
      function bindEyeToggle(btnId) {
        document.getElementById(btnId).addEventListener("click", () => { applyShowPassword(!showPassword); });
      }
      bindEyeToggle("login-eye");
      bindEyeToggle("signup-eye");
      function triggerLookAtEachOther() { lookingAtEachOther = true; setTimeout(() => { lookingAtEachOther = false; }, 800); }
      function scheduleBlink(setter) {
        const delay = Math.random() * 4000 + 3000;
        setTimeout(() => { setter(true); setTimeout(() => { setter(false); scheduleBlink(setter); }, 150); }, delay);
      }
      scheduleBlink((v) => { purpleBlink = v; });
      scheduleBlink((v) => { blackBlink = v; });
      function schedulePeek() {
        if (passwordLen > 0 && showPassword) {
          const delay = Math.random() * 3000 + 2000;
          setTimeout(() => {
            if (passwordLen > 0 && showPassword) {
              purplePeeking = true;
              setTimeout(() => { purplePeeking = false; schedulePeek(); }, 800);
            }
          }, delay);
        }
      }
      const peekInterval = setInterval(() => { if (passwordLen > 0 && showPassword && !purplePeeking) schedulePeek(); }, 1000);
      function calcPos(el) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 3;
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        return { faceX: Math.max(-15, Math.min(15, dx / 20)), faceY: Math.max(-10, Math.min(10, dy / 30)), bodySkew: Math.max(-6, Math.min(6, -dx / 120)) };
      }
      function eyePupilOffset(el, maxDist, forceX, forceY) {
        if (forceX !== undefined && forceY !== undefined) return { x: forceX, y: forceY };
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
        const angle = Math.atan2(dy, dx);
        return { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist };
      }
      function setPupil(eyeEl, maxDist, forceX, forceY) {
        const pupil = eyeEl.querySelector(".pupil");
        if (!pupil) return;
        const o = eyePupilOffset(eyeEl, maxDist, forceX, forceY);
        pupil.style.transform = `translate(${o.x}px, ${o.y}px)`;
      }
      function setPupilOnly(el, maxDist, forceX, forceY) {
        const o = eyePupilOffset(el, maxDist, forceX, forceY);
        el.style.transform = `translate(${o.x}px, ${o.y}px)`;
      }
      function render() {
        const pp = calcPos($purple);
        const bp = calcPos($black);
        const op = calcPos($orange);
        const yp = calcPos($yellow);
        const isHiding = passwordLen > 0 && !showPassword;
        const isShowingPw = passwordLen > 0 && showPassword;
        if (isShowingPw) { $purple.style.transform = "skewX(0deg)"; $purple.style.height = "400px"; }
        else if (isTyping || isHiding) { $purple.style.transform = `skewX(${(pp.bodySkew || 0) - 12}deg) translateX(40px)`; $purple.style.height = "440px"; }
        else { $purple.style.transform = `skewX(${pp.bodySkew || 0}deg)`; $purple.style.height = "400px"; }
        const purpleEyeL = $purpleEyes.children[0]; const purpleEyeR = $purpleEyes.children[1];
        purpleEyeL.style.height = purpleBlink ? "2px" : "18px"; purpleEyeR.style.height = purpleBlink ? "2px" : "18px";
        let pfx, pfy;
        if (isShowingPw) { $purpleEyes.style.left = "20px"; $purpleEyes.style.top = "35px"; pfx = purplePeeking ? 4 : -4; pfy = purplePeeking ? 5 : -4; }
        else if (lookingAtEachOther) { $purpleEyes.style.left = "55px"; $purpleEyes.style.top = "65px"; pfx = 3; pfy = 4; }
        else { $purpleEyes.style.left = 45 + pp.faceX + "px"; $purpleEyes.style.top = 40 + pp.faceY + "px"; pfx = undefined; pfy = undefined; }
        setPupil(purpleEyeL, 5, pfx, pfy); setPupil(purpleEyeR, 5, pfx, pfy);
        if (isShowingPw) { $black.style.transform = "skewX(0deg)"; }
        else if (lookingAtEachOther) { $black.style.transform = `skewX(${(bp.bodySkew || 0) * 1.5 + 10}deg) translateX(20px)`; }
        else if (isTyping || isHiding) { $black.style.transform = `skewX(${(bp.bodySkew || 0) * 1.5}deg)`; }
        else { $black.style.transform = `skewX(${bp.bodySkew || 0}deg)`; }
        const blackEyeL = $blackEyes.children[0]; const blackEyeR = $blackEyes.children[1];
        blackEyeL.style.height = blackBlink ? "2px" : "16px"; blackEyeR.style.height = blackBlink ? "2px" : "16px";
        let bfx, bfy;
        if (isShowingPw) { $blackEyes.style.left = "10px"; $blackEyes.style.top = "28px"; bfx = -4; bfy = -4; }
        else if (lookingAtEachOther) { $blackEyes.style.left = "32px"; $blackEyes.style.top = "12px"; bfx = 0; bfy = -4; }
        else { $blackEyes.style.left = 26 + bp.faceX + "px"; $blackEyes.style.top = 32 + bp.faceY + "px"; bfx = undefined; bfy = undefined; }
        setPupil(blackEyeL, 4, bfx, bfy); setPupil(blackEyeR, 4, bfx, bfy);
        $orange.style.transform = isShowingPw ? "skewX(0deg)" : `skewX(${op.bodySkew || 0}deg)`;
        let ofx, ofy;
        if (isShowingPw) { $orangeEyes.style.left = "50px"; $orangeEyes.style.top = "85px"; ofx = -5; ofy = -4; }
        else { $orangeEyes.style.left = 82 + (op.faceX || 0) + "px"; $orangeEyes.style.top = 90 + (op.faceY || 0) + "px"; ofx = undefined; ofy = undefined; }
        setPupilOnly($orangeEyes.children[0], 5, ofx, ofy); setPupilOnly($orangeEyes.children[1], 5, ofx, ofy);
        $yellow.style.transform = isShowingPw ? "skewX(0deg)" : `skewX(${yp.bodySkew || 0}deg)`;
        let yfx, yfy;
        if (isShowingPw) { $yellowEyes.style.left = "20px"; $yellowEyes.style.top = "35px"; $yellowMouth.style.left = "10px"; $yellowMouth.style.top = "88px"; yfx = -5; yfy = -4; }
        else { $yellowEyes.style.left = 52 + (yp.faceX || 0) + "px"; $yellowEyes.style.top = 40 + (yp.faceY || 0) + "px"; $yellowMouth.style.left = 40 + (yp.faceX || 0) + "px"; $yellowMouth.style.top = 88 + (yp.faceY || 0) + "px"; yfx = undefined; yfy = undefined; }
        setPupilOnly($yellowEyes.children[0], 5, yfx, yfy); setPupilOnly($yellowEyes.children[1], 5, yfx, yfy);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    </script>

    <!-- 真实后端接线：复用站点 IF 客户端（InsForge），登录/注册+邮箱验证逻辑与原站一致 -->
    <script>
      (function () {
        var frontForm = document.querySelector('.doodle-card-front .doodle-form');
        var backForm  = document.querySelector('.doodle-card-back .doodle-form');
        var loginPw   = document.getElementById('login-pw');
        var signupPw  = document.getElementById('signup-pw');
        var overlay   = document.getElementById('auth-overlay');
        var ovTitle   = document.getElementById('auth-overlay-title');
        var ovSub     = document.getElementById('auth-overlay-sub');
        var ovErr     = document.getElementById('auth-overlay-error');
        var codeInput = document.getElementById('verify-code-input');
        var verifyBtn = document.getElementById('verify-submit-btn');
        var backBtn   = document.getElementById('auth-overlay-back');
        var pending = { email: null, password: null };

        function showErr(formEl, msg) {
          var p = formEl.parentNode.querySelector('.doodle-login-err');
          if (!p) {
            p = document.createElement('p');
            p.className = 'doodle-login-err';
            p.style.cssText = 'color:#d33;font-size:13px;margin:8px 0 0;text-align:center;';
            formEl.parentNode.appendChild(p);
          }
          p.textContent = msg || '出错了，请重试';
        }
        function ok(msg) {
          // 跳转到网站主页
          setTimeout(function () {
            window.location.href = '../index.html';
          }, 300);
        }

        function openOverlay(title, sub) {
          ovTitle.textContent = title; ovSub.textContent = sub || '';
          ovErr.textContent = ''; codeInput.value = '';
          overlay.style.display = 'flex';
          setTimeout(function () { try { codeInput.focus(); } catch (e) {} }, 100);
        }
        function closeOverlay() { overlay.style.display = 'none'; }

        function wire() {
          if (!window.IF) return;
          var IF = window.IF;

          frontForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var email = frontForm.querySelector('input[type="email"]').value.trim();
            var pw = loginPw.value;
            if (!email || !pw) { showErr(frontForm, '请输入邮箱和密码'); return; }
            var btn = frontForm.querySelector('.doodle-btn');
            if (btn) { btn.disabled = true; btn.textContent = '登录中...'; }
            IF.signIn(email, pw).then(function (user) {
              ok('登录成功 🎉');
            }).catch(function (err) {
              if (btn) { btn.disabled = false; btn.textContent = 'Let\\'s Go!'; }
              showErr(frontForm, (err && err.message) || '登录失败');
            });
          });

          backForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var email = backForm.querySelector('input[type="email"]').value.trim();
            var name  = backForm.querySelector('input[type="text"]').value.trim();
            var pw = signupPw.value;
            if (!email || !name || !pw) { showErr(backForm, '请填写邮箱、昵称和密码'); return; }
            var btn = backForm.querySelector('.doodle-btn-alt');
            if (btn) { btn.disabled = true; btn.textContent = '注册中...'; }
            IF.signUp(email, pw, name, name).then(function (res) {
              if (btn) { btn.disabled = false; btn.textContent = 'Sign up'; }
              pending.email = email; pending.password = pw;
              openOverlay('验证邮箱', '我们已向 ' + email + ' 发送 6 位验证码');
            }).catch(function (err) {
              if (btn) { btn.disabled = false; btn.textContent = 'Sign up'; }
              showErr(backForm, (err && err.message) || '注册失败');
            });
          });

          verifyBtn.addEventListener('click', function () {
            var code = (codeInput.value || '').trim();
            if (!code) { ovErr.textContent = '请输入验证码'; return; }
            verifyBtn.disabled = true;
            IF.verifyEmail(pending.email, code, pending.password).then(function () {
              verifyBtn.disabled = false; closeOverlay(); ok('验证成功，已登录 🎉');
            }).catch(function (err) {
              verifyBtn.disabled = false; ovErr.textContent = (err && err.message) || '验证失败';
            });
          });
          backBtn.addEventListener('click', closeOverlay);
        }

        if (window.IF) wire();
        else document.addEventListener('IF_READY', wire, { once: true });

        // Fallback：3秒后 IF 还没加载，提示用户
        setTimeout(function () {
          if (!window.IF) {
            console.warn('[doodle-login] IF 客户端未加载，可能需要通过服务器访问此页面');
            var hint = document.createElement('div');
            hint.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#fff3cd;border:1px solid #ffc107;color:#856404;padding:8px 16px;border-radius:8px;font-size:13px;z-index:9999;';
            hint.textContent = '⚠ 请通过服务器访问本页（不要直接双击文件），否则无法连接后端';
            document.body.appendChild(hint);
          }
        }, 3000);
      })();
    </script>
